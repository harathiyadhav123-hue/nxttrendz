services:
  backend:
    build:
      context: ./backend
    container_name: nxttrendz-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - nxttrendz_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: nxttrendz-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nxttrendz_data:
